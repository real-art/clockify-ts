name: Sonarcube Code Quality Check
on:
  # Trigger analysis when pushing in master or pull requests, and when creating
  # a pull request.
  push:
    branches:
      - master
      - dev
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
jobs:
  testing:
    name: Testing
    runs-on: ubuntu-latest
    env:
      CLOCKIFY_API_KEY: ${{ secrets.CLOCKIFY_API_KEY }}
      TEST_WORKSPACE_ID: ${{ secrets.TEST_WORKSPACE_ID }}
      TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_CLIENT_ID: ${{ secrets.TEST_CLIENT_ID }}
      TEST_PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}
      TEST_TASK_ID: ${{ secrets.TEST_TASK_ID }}
      TEST_TAG_ID: ${{ secrets.TEST_TAG_ID }}
      TEST_TIME_ENTRY_ID: ${{ secrets.TEST_TIME_ENTRY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm run test

      - name: Upload Testing Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: testing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Testing Artifacts
        uses: actions/download-artifact@v4
        with:
          name: reports
          path: reports

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
